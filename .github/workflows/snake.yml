name: 🐍 Generate GitHub Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: 🐍 Generate Animated Snake
        uses: Platane/snk@v3

        with:
          github_user_name: dipakpatil-0701

          outputs: |
            dist/github-snake.gif?color_snake=#00ff88&color_background=#0d1117
            dist/github-snake.svg?palette=github-dark&color_snake=#00ff88

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚀 Publish Snake Animation
        uses: peaceiris/actions-gh-pages@v4

        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          commit_message: "🐍 Update contribution snake"
